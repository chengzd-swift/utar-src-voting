<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UTAR SRC Voting — Change Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f4f6fb;--white:#fff;--navy:#0f1e3c;--teal:#0ea5e9;--teal-dark:#0284c7;--muted:#64748b;--border:#e2e8f0}
    body{min-height:100vh;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--white);border-radius:20px;padding:48px 44px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(15,30,60,.12)}
    .icon-wrap{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0ea5e9,#10b981);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:20px}
    .card-title{font-size:1.5rem;font-weight:800;margin-bottom:4px}
    .card-sub{font-size:.85rem;color:var(--muted);margin-bottom:28px;line-height:1.6}
    .notice{padding:14px 16px;border-radius:10px;font-size:.83rem;margin-bottom:24px;display:none}
    .notice.visible{display:flex;align-items:flex-start;gap:10px}
    .notice-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:.78rem;font-weight:600;color:var(--navy);margin-bottom:6px}
    .field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;font-family:'Plus Jakarta Sans',sans-serif;color:var(--navy);background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
    .field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,165,233,.1);background:#fff}
    .pw-bar{height:4px;border-radius:999px;background:var(--border);margin-top:8px;overflow:hidden}
    .pw-fill{height:100%;border-radius:999px;transition:width .3s,background .3s;width:0}
    .pw-label{font-size:.74rem;margin-top:4px}
    .btn{width:100%;padding:13px;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(14,165,233,.3)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .msg{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.85rem;display:none}
    .msg.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
    .msg.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a}
    .msg.visible{display:block}
    .back{text-align:center;margin-top:20px;font-size:.82rem;color:var(--muted)}
    .back a{color:var(--teal);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">🔑</div>
  <h2 class="card-title">Change Password</h2>
  <p class="card-sub" id="cardSub">Update your account password.</p>
  <div class="notice notice-warn" id="firstLoginNotice"><span>⚠️</span><span>You are using a default password. You must set a personal password before continuing.</span></div>
  <div class="field"><label>Current Password</label><input type="password" id="currentPw" placeholder="Enter current password"/></div>
  <div class="field">
    <label>New Password</label>
    <input type="password" id="newPw" placeholder="Min. 8 characters" oninput="checkStrength()"/>
    <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
    <div class="pw-label" id="pwLabel" style="color:var(--muted)"></div>
  </div>
  <div class="field"><label>Confirm New Password</label><input type="password" id="confirmPw" placeholder="Re-enter new password"/></div>
  <button class="btn" id="changeBtn" onclick="handleChange()">Update Password</button>
  <div class="msg" id="msg"></div>
  <p class="back" id="backLink"><a href="login.html">← Back to login</a></p>
</div>
<script>
  const user=JSON.parse(sessionStorage.getItem('user')||'null');
  const mustChange=sessionStorage.getItem('mustChangePassword')==='true';
  if (!user) window.location.href='login.html';
  if (mustChange) {
    document.getElementById('firstLoginNotice').classList.add('visible');
    document.getElementById('cardSub').textContent=`Welcome ${user.full_name}! Please set a personal password before accessing your panel.`;
    document.getElementById('backLink').style.display='none';
    const hint=user.role==='election_committee'?'EC123':'Your current password';
    document.getElementById('currentPw').placeholder=`Default: ${hint}`;
  }
  function checkStrength() {
    const pw=document.getElementById('newPw').value;
    const fill=document.getElementById('pwFill'); const lbl=document.getElementById('pwLabel');
    let score=0;
    if(pw.length>=8)score++; if(/[A-Z]/.test(pw))score++; if(/[0-9]/.test(pw))score++; if(/[^A-Za-z0-9]/.test(pw))score++;
    const colors=['#ef4444','#f97316','#eab308','#10b981'],labels=['Weak','Fair','Good','Strong'],widths=['25%','50%','75%','100%'];
    if(!pw.length){fill.style.width='0';lbl.textContent='';return;}
    fill.style.width=widths[score-1]||'25%'; fill.style.background=colors[score-1]||'#ef4444';
    lbl.textContent=labels[score-1]||'Weak'; lbl.style.color=colors[score-1]||'#ef4444';
  }
  function showMsg(text,type){const el=document.getElementById('msg');el.textContent=text;el.className=`msg ${type} visible`;}
  async function handleChange() {
    const current=document.getElementById('currentPw').value;
    const newPw=document.getElementById('newPw').value;
    const confirm=document.getElementById('confirmPw').value;
    if(!current||!newPw||!confirm)return showMsg('All fields are required.','error');
    if(newPw.length<8)return showMsg('New password must be at least 8 characters.','error');
    if(newPw!==confirm)return showMsg('Passwords do not match.','error');
    if(current===newPw)return showMsg('New password must differ from current.','error');
    const btn=document.getElementById('changeBtn');
    btn.disabled=true; btn.textContent='Updating...';
    try {
      const res=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:user.student_id,current_password:current,new_password:newPw})});
      const data=await res.json();
      if(!res.ok){showMsg(data.error||'Failed.','error');btn.disabled=false;btn.textContent='Update Password';return;}
      showMsg('✅ Password changed! Redirecting...','success');
      sessionStorage.removeItem('mustChangePassword');
      setTimeout(()=>{
        if(user.role==='election_committee') window.location.href='ec.html';
        else window.location.href='vote.html';
      },1500);
    } catch { showMsg('Network error.','error'); btn.disabled=false; btn.textContent='Update Password'; }
  }
  document.getElementById('confirmPw').addEventListener('keydown',e=>{if(e.key==='Enter')handleChange();});
</script>
<script src="chat-widget.js"></script>
</body>
</html>
